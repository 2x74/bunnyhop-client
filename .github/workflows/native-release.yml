# Native candidates only. Review/promotion is a separate authenticated, owner-approved service.
# No release publication, production writes, credentials or automatic update activation.
name: Native release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Native package version without v (for example 0.4.0)
        default: 0.4.0
        required: true
        type: string
      platform:
        description: Platform to build (all for a complete release)
        type: choice
        default: all
        options: [all, windows, linux, macos]
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: native
jobs:
  version:
    if: github.repository == '2x74/bunnyhop-client' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate exact native release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then version="${TAG#v}"; else version="$INPUT_VERSION"; fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an exact numeric semantic version, such as 0.0.1' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  automation:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/native-release/*.test.mjs
  resources:
    needs: [version, automation]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run wasm
      - run: bun run check
      - run: bun apps/native/src/export-viewmodels.ts
      - run: bun apps/native/src/export-presentation.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/target/native-assets
            native/target/native-menu/menu.html
            native/target/native-menu/menu-manifest.json
          if-no-files-found: error
  windows:
    outputs:
      artifact_id: ${{ steps.package-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.package-upload.outputs.artifact-digest }}
      parity_artifact_id: ${{ steps.parity-upload.outputs.artifact-id }}
      parity_artifact_digest: ${{ steps.parity-upload.outputs.artifact-digest }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: [version, resources]
    timeout-minutes: 90
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install replay export test encoder
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
      - name: Adversarial release-check exit-code regression
        shell: pwsh
        run: ../.github/scripts/native-release/windows-exit.test.ps1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup override set 1.99.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target
      - shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: ./apps/native/packaging/windows/build.ps1 -Version $env:PACKAGE_VERSION
      - shell: pwsh
        run: |
          $package = Get-ChildItem target/native-packages -Directory | Select-Object -First 1
          bun apps/native/packaging/release-check.ts --package $package.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package release-check failed' }
          & (Join-Path $package.FullName 'bunnyhop-native.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable failed DLL/runtime startup' }
      - run: bun apps/native/packaging/checksums.ts --package-dir target/native-packages
      - name: Preserve exact movement parity inputs, outputs and report
        id: parity-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-parity-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target/native-parity
          if-no-files-found: error
          retention-days: 30
      - id: package-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bunnyhop-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/target/native-packages/*.zip
            native/target/native-packages/*.json
            native/target/native-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  macos:
    outputs:
      artifact_id: ${{ steps.package-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.package-upload.outputs.artifact-digest }}
      parity_artifact_id: ${{ steps.parity-upload.outputs.artifact-id }}
      parity_artifact_digest: ${{ steps.parity-upload.outputs.artifact-digest }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: [version, resources]
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup override set 1.99.1
      - run: brew install sdl3 ninja cmake ffmpeg
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target
      - run: test "$(uname -m)" = arm64
      - run: bun apps/native/build.ts --prebuilt-resources
      - name: Required native movement vs pinned WASM (v17 and v16 contrast)
        run: bun apps/native/tools/parity-gate.ts && bun test apps/native/tools/parity-gate.test.ts
      - run: ctest --test-dir apps/native/build --output-on-failure --no-tests=error
      - run: cargo test -p bunnyhop-native-bridge --locked && cargo test -p bunnyhop-core --features native-wasm-math --test physics_versions --test entities --test render --locked && bun test apps/native/packaging
      - env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bun apps/native/package.ts --skip-build --version "$PACKAGE_VERSION"
      - env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bun apps/native/packaging/release-check.ts --package "target/native-packages/bunnyhop-native-$PACKAGE_VERSION-darwin-arm64"
      - run: bun apps/native/packaging/checksums.ts --package-dir target/native-packages
      - name: Preserve exact movement parity inputs, outputs and report
        id: parity-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-parity-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target/native-parity
          if-no-files-found: error
          retention-days: 30
      - id: package-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bunnyhop-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/target/native-packages/*.zip
            native/target/native-packages/*.json
            native/target/native-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  linux:
    outputs:
      artifact_id: ${{ steps.package-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.package-upload.outputs.artifact-digest }}
      parity_artifact_id: ${{ steps.parity-upload.outputs.artifact-id }}
      parity_artifact_digest: ${{ steps.parity-upload.outputs.artifact-digest }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: [version, resources]
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup override set 1.99.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake ninja-build g++ pkg-config patchelf binutils libcurl4-openssl-dev zlib1g-dev libwebkit2gtk-4.1-dev libgtk-3-dev libpango1.0-dev fonts-dejavu-core fonts-noto-core libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libasound2-dev libpulse-dev xvfb xauth
      - run: |
          git clone --filter=blob:none --no-checkout https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" checkout --detach 829a65d769d935c4852f8159e964312c0957260a
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL-install" -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/SDL-build" --parallel
          cmake --install "$RUNNER_TEMP/SDL-build"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target
      - env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/SDL-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/SDL-install/lib
        run: |
          bun apps/native/build.ts --prebuilt-resources
          bun apps/native/tools/parity-gate.ts
          bun test apps/native/tools/parity-gate.test.ts
          ctest --test-dir apps/native/build --output-on-failure --no-tests=error
          cargo test -p bunnyhop-native-bridge --locked
          cargo test -p bunnyhop-core --features native-wasm-math --test physics_versions --test entities --test render --locked
          bun test apps/native/packaging
      - env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          LD_LIBRARY_PATH: ${{ runner.temp }}/SDL-install/lib
        run: bun apps/native/package.ts --skip-build --version "$PACKAGE_VERSION" --licenses "$RUNNER_TEMP/SDL-install/share/licenses"
      - env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          package="target/native-packages/bunnyhop-native-$PACKAGE_VERSION-linux-x64"
          env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT bun apps/native/packaging/release-check.ts --package "$package"
          env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT "$package/bin/bunnyhop-native" --help
      - run: bun apps/native/packaging/checksums.ts --package-dir target/native-packages
      - name: Preserve exact movement parity inputs, outputs and report
        id: parity-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-parity-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/target/native-parity
          if-no-files-found: error
          retention-days: 30
      - id: package-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bunnyhop-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/target/native-packages/*.tar.gz
            native/target/native-packages/*.json
            native/target/native-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  evidence:
    if: >-
      always() && needs.version.result == 'success' && needs.resources.result == 'success' &&
      needs.automation.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    needs: [version, automation, resources, windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bunnyhop-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-parity-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts
      - name: Verify exact packages and collect immutable candidate evidence
        id: evidence
        env:
          CANDIDATE_NEEDS: ${{ toJSON(needs) }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
        run: node .github/scripts/native-release/evidence.mjs candidate-artifacts candidate-evidence.json
      - name: Store evidence for isolated review (no admission or publishing)
        id: evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable evidence coordinates
        env:
          EVIDENCE_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
          EVIDENCE_SHA256: ${{ steps.evidence.outputs.sha256 }}
        run: |
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Candidate only; owner promotion is not activated.\n\nEvidence artifact ID: ${process.env.EVIDENCE_ID}\n\nActions ZIP SHA-256: ${process.env.EVIDENCE_DIGEST}\n\nEvidence JSON SHA-256: ${process.env.EVIDENCE_SHA256}\n`)'
