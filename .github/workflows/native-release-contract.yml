name: Native release contract
on:
  pull_request:
    paths:
      - '.github/**'
      - 'native/apps/native/packaging/**'
      - 'native/apps/native/package.ts'
      - 'native/apps/native/tools/**'
      - 'native/tools/tutorial/bsp.ts'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'native/apps/native/packaging/**'
      - 'native/apps/native/package.ts'
      - 'native/apps/native/tools/**'
      - 'native/tools/tutorial/bsp.ts'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/native-release/*.test.mjs
