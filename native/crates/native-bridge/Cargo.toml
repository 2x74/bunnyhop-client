[package]
name = "bunnyhop-native-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bunnyhop-core = { path = "../core", features = ["native-wasm-math"] }
playsrc-bsp = { path = "../vendor/bsp" }
serde_json = "1"
sha2 = "0.11"
flate2 = "1.1"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["lzma"] }
